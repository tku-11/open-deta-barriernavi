<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>バリアナビ｜詳細</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <div class="app-shell">
                <main class="detail-panel detail-page">

            <div class="detail-header">
                <div>
                    <a id="back_btn" class="ghost-btn" href="/index">← 一覧へ戻る</a>
                </div>
                <h1 id="detail-title">詳細</h1>
            </div>

                        <div class="detail-summary">
                <div class="detail-score" id="detail-score">-</div>
                <div id="detail-meta" class="detail-meta"></div>
            </div>
            <p id="detail-status" class="status-message" role="status" aria-live="polite" aria-atomic="true">駅の詳細情報を読み込みます。</p>

            <div class="detail-table-wrapper">
                <table>
                    <caption>バリアフリー評価項目の現状、基準値、達成判定</caption>

                    <thead>
                        <tr>
                                                        <th scope="col">項目</th>
                            <th scope="col">設置の有無と数</th>

                                                        <th scope="col">基準値</th>
                            <th scope="col">判定</th>

                        </tr>
                    </thead>
                    <tbody id="detail-table-body">
                                                <tr><td colspan="4" style="text-align:center;">読み込み中...</td></tr>

                    </tbody>
                </table>
            </div>
                </main>

    </div>

    <script type="module" src="/dist/detail.js"></script>
</body>
</html>
