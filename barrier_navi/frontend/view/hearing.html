<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>バリアナビ（聴覚障害向け）</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body data-mode="hearing">
    <div class="app-shell">
        <main class="body-layout">
            <section class="list-panel">
                <div style="margin-bottom: 20px;">
                    <a href="/home" class="ghost-btn" style="text-decoration: none;">← ホームに戻る</a>
                </div>
                <div class="panel-header">
                                        <h1>聴覚のバリアフリー情報</h1>
                    <p>案内や設備の条件に合う駅を探し、バリアフリー情報を比較できます。</p>

                </div>

                                <div class="search-area" role="search">
                    <label class="visually-hidden" for="search-input">駅名で検索</label>
                    <input type="search" id="search-input" placeholder="駅名で検索" aria-describedby="search-help" />
                    <span id="search-help" class="visually-hidden">駅名を入力して検索します。</span>
                    <button id="search-btn" class="primary-btn">検索</button>
                </div>

                <div class="sort-area">
                    <label for="sort-select">並び替え:</label>
                    <select id="sort-select" class="sort-select">
                        <option value="none">指定なし</option>
                        <option value="score-asc">点数: 昇順</option>
                        <option value="score-desc">点数: 降順</option>
                    </select>
                </div>

                                <section id="result-summary" class="result-summary" aria-labelledby="result-summary-heading">
                    <h2 id="result-summary-heading">検索結果の要約</h2>
                    <p id="result-summary-text">条件を指定して駅を検索できます。</p>
                    <div id="result-summary-badges" class="result-summary-badges"></div>
                </section>
                <button id="filter-toggle" class="mobile-filter-toggle ghost-btn" type="button" aria-expanded="false" aria-controls="filter-panel">絞り込みを開く</button>
                <p id="results-status" class="status-message" role="status" aria-live="polite" aria-atomic="true">条件を指定して駅を検索できます。</p>
                <div id="loading" class="loading" role="status" aria-live="polite" aria-busy="false" style="display: none;">
                    <p>駅情報を読み込み中です。</p>
                </div>

                <section aria-labelledby="station-list-heading">
                    <h2 id="station-list-heading" class="visually-hidden" tabindex="-1">駅の検索結果</h2>
                    <div id="stations-list" class="station-list" aria-busy="false"></div>
                </section>

                <nav class="pagination" aria-label="検索結果のページ移動">
                    <button id="first-btn" class="ghost-btn" aria-label="最初のページへ">« 最初へ</button>
                    <button id="prev-btn" class="ghost-btn" aria-label="前のページへ">前へ</button>
                    <span id="page-info" aria-live="polite">ページ 1</span>
                    <button id="next-btn" class="ghost-btn" aria-label="次のページへ">次へ</button>
                    <button id="last-btn" class="ghost-btn" aria-label="最後のページへ">最後へ »</button>
                </nav>

            </section>

                        <aside id="filter-panel" class="filter-panel" aria-labelledby="filter-heading">

                <h2 id="filter-heading">絞り込み</h2>

                <div class="filter-group">
                    <label>障害選択</label>
                    <div class="chip chip-active">聴覚障害</div>
                </div>

                <div class="filter-group">
                    <label for="prefecture-select">都道府県</label>
                    <select id="prefecture-select">
                        <option value="">読み込み中...</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label for="line-select">路線</label>
                    <select id="line-select">
                        <option value="">指定なし</option>
                    </select>
                </div>

                <div class="filter-group">
                                        <label>バリアフリー設備で絞り込み（すべて満たす駅を表示）</label>

                    <div id="filter-list" class="filter-list"></div>
                </div>

                <div class="filter-buttons">
                    <button id="apply-filter-btn" class="primary-btn">条件を適用</button>
                    <button id="reset-filter-btn" class="ghost-btn">リセット</button>
                </div>

                <div class="filter-group" id="active-filters-group" style="display: none;">
                    <label>適用中の条件</label>
                    <div id="active-filters" class="active-filters"></div>
                </div>
            </aside>
        </main>
    </div>

        <script type="module" src="/dist/index.js"></script>

</body>
</html>
